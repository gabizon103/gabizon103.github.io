{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ section.title }}
</h1>
<ul>
  <!-- If you are using pagination, section.pages will be empty.
       You need to use the paginator object -->  
  {% for page in section.pages %}
  <li><h2><a href="{{ page.permalink | safe }}">{{ page.title }}</a></h2></li>
  {{ page.description | safe }}
  {% endfor %}
</ul>
{% endblock content %}
